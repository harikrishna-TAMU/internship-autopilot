[project]
name = "applypilot"
version = "0.1.0"
description = "Turns emailed internship links into a tracked job list, tailored resumes and pre-filled applications. Never submits."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "playwright>=1.48",
    "jinja2>=3.1",
    "pypdf>=5.0",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.scripts]
autopilot = "autopilot.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["browser: needs a local Chrome/Chromium (skipped if none is available)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = ["B008", "E501"]
