<!doctype html>
<html>
<head><meta charset="utf-8"><title>Acme - Software Engineering Intern</title></head>
<body>
<h1>Software Engineering Intern</h1>
<form id="application" action="https://example.invalid/submit" method="post"
      onsubmit="window.__submitted = true; return false;">
  <div class="field"><label for="first_name">First Name *</label><input id="first_name" name="first_name" required></div>
  <div class="field"><label for="last_name">Last Name *</label><input id="last_name" name="last_name" required></div>
  <div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
  <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div>
  <div class="field"><label for="resume">Resume/CV *</label><input id="resume" name="resume" type="file" accept=".pdf,.doc,.docx"></div>
  <div class="field"><label for="cover_letter">Cover Letter</label><input id="cover_letter" name="cover_letter" type="file"></div>
  <div class="field"><label for="linkedin">LinkedIn Profile</label><input id="linkedin" name="linkedin"></div>
  <div class="field">
    <label for="school">School *</label>
    <select id="school" name="school" required>
      <option value="">Select...</option><option>Texas A&amp;M University</option><option>Other</option>
    </select>
  </div>
  <fieldset>
    <legend>Are you legally authorized to work in the United States? *</legend>
    <label><input type="radio" name="authorized" value="1" required> Yes</label>
    <label><input type="radio" name="authorized" value="0"> No</label>
  </fieldset>
  <fieldset>
    <legend>Will you now or in the future require visa sponsorship? *</legend>
    <label><input type="radio" name="sponsorship" value="1" required> Yes</label>
    <label><input type="radio" name="sponsorship" value="0"> No</label>
  </fieldset>
  <div class="field"><label for="why">Why do you want to work at Acme? *</label><textarea id="why" name="why" required></textarea></div>
  <div class="field">
    <label for="gender">Gender</label>
    <select id="gender" name="gender"><option value="">Select...</option><option>Male</option><option>Female</option><option>Decline to self-identify</option></select>
  </div>
  <div class="field"><input type="checkbox" id="consent" name="consent" required><label for="consent">I certify that the information provided is accurate *</label></div>
  <button type="submit" id="submit_app">Submit Application</button>
</form>
</body>
</html>
